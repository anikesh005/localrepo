<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Navbar</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #333;
        padding: 10px 20px;
      }
      .navbar a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
        font-size: 16px;
      }
      .navbar a:hover {
        color: yellow;
      }
    </style>
  </head>
  <body>
    <!-- Navbar Start -->
    <div class="navbar">
      <div class="logo"><a href="#">MyWebsite</a></div>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a> 
      </div>
    </div>
  </body>
</html>
